name: Test Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-scaffolding:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: "fastapi"
            flags: "--fastapi"
            scope: "fullstack"
            install_cmd: 'pip install "/tmp/test-project/api[dev]"'
          - variant: "nestjs"
            flags: "--nestjs"
            scope: "fullstack"
            install_cmd: "npm install --prefix /tmp/test-project/api"
          - variant: "fastapi-entra"
            flags: "--fastapi --auth entra"
            scope: "fullstack"
            install_cmd: 'pip install "/tmp/test-project/api[dev]"'
          - variant: "nestjs-entra"
            flags: "--nestjs --auth entra"
            scope: "fullstack"
            install_cmd: "npm install --prefix /tmp/test-project/api"
          - variant: "fastapi-api"
            flags: "--fastapi --scope api"
            scope: "api"
            install_cmd: 'pip install "/tmp/test-project/api[dev]"'
          - variant: "nestjs-api"
            flags: "--nestjs --scope api"
            scope: "api"
            install_cmd: "npm install --prefix /tmp/test-project/api"
          - variant: "frontend"
            flags: "--scope frontend"
            scope: "frontend"

    name: Test ${{ matrix.variant }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install project-initializer package
        run: pip install -e .

      - name: Create test project
        run: |
          mkdir -p /tmp/test-project
          project-initializer /tmp/test-project ${{ matrix.flags }} --force

      - name: Install frontend dependencies
        if: matrix.scope != 'api'
        working-directory: /tmp/test-project/frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Angular frontend
        if: matrix.scope != 'api'
        working-directory: /tmp/test-project/frontend
        run: npm run build

      - name: Install API dependencies
        if: matrix.scope != 'frontend'
        run: ${{ matrix.install_cmd }}

      - name: Start Docker services
        working-directory: /tmp/test-project
        run: docker compose up -d --build

      - name: Wait for API to be healthy
        if: matrix.scope != 'frontend'
        working-directory: /tmp/test-project
        run: |
          echo "Waiting for API to start..."
          sleep 30

          echo "Checking database health..."
          docker compose ps db 2>/dev/null | grep -q "healthy" || echo "DB service not present or not healthy (expected for some variants)"

          echo "Checking API health..."
          for i in {1..10}; do
            if curl -s http://localhost:8000/health > /dev/null 2>&1 || curl -s http://localhost:8000/docs > /dev/null 2>&1; then
              echo "API is responding"
              break
            fi
            echo "Waiting for API... (attempt $i)"
            sleep 5
          done

      - name: Wait for frontend to be healthy
        if: matrix.scope != 'api'
        working-directory: /tmp/test-project
        run: |
          echo "Waiting for frontend to start..."
          sleep 10

          echo "Checking frontend health..."
          for i in {1..10}; do
            if curl -s http://localhost:4200 > /dev/null 2>&1; then
              echo "Frontend is responding"
              break
            fi
            echo "Waiting for frontend... (attempt $i)"
            sleep 5
          done

      - name: Show container status
        working-directory: /tmp/test-project
        run: docker compose ps

      - name: Verify API endpoint
        if: matrix.scope != 'frontend'
        working-directory: /tmp/test-project
        run: |
          echo "=== Testing API /health endpoint ==="
          curl -v http://localhost:8000/health || (echo "API /health not accessible" && docker compose logs api && exit 1)

      - name: Verify frontend
        if: matrix.scope != 'api'
        working-directory: /tmp/test-project
        run: |
          echo "=== Testing Frontend ==="
          curl -s -o /dev/null -w "%{http_code}" http://localhost:4200 | grep -q "200" || (echo "Frontend not accessible" && docker compose logs frontend && exit 1)

      - name: Show logs on failure
        if: failure()
        working-directory: /tmp/test-project
        run: |
          echo "=== Docker Compose Logs ==="
          docker compose logs

      - name: Cleanup
        if: always()
        working-directory: /tmp/test-project
        run: docker compose down -v

  # Each scaffolded variant ships its own test suite. The job above proves the
  # stack boots; this one proves the generated tests, lint and formatting hold
  # for every auth mode, without Docker (the suites use in-memory fakes).
  test-variant-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: "fastapi-none"
            stack: "fastapi"
            flags: "--fastapi"
          - suite: "fastapi-token"
            stack: "fastapi"
            flags: "--fastapi --auth token"
          - suite: "fastapi-supabase"
            stack: "fastapi"
            flags: "--fastapi --auth supabase"
          - suite: "fastapi-entra"
            stack: "fastapi"
            flags: "--fastapi --auth entra"
          - suite: "fastapi-async"
            stack: "fastapi"
            flags: "--fastapi --async-db"
          - suite: "nestjs-none"
            stack: "nestjs"
            flags: "--nestjs"
          - suite: "nestjs-token"
            stack: "nestjs"
            flags: "--nestjs --auth token"
          - suite: "nestjs-supabase"
            stack: "nestjs"
            flags: "--nestjs --auth supabase"
          - suite: "nestjs-entra"
            stack: "nestjs"
            flags: "--nestjs --auth entra"

    name: Suite ${{ matrix.suite }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project-initializer package
        run: pip install -e .

      - name: Create test project
        run: project-initializer /tmp/suite-project ${{ matrix.flags }} --scope api --force --yes

      - name: Install FastAPI dependencies
        if: matrix.stack == 'fastapi'
        working-directory: /tmp/suite-project/api
        run: pip install ".[dev]"

      - name: Run FastAPI test suite
        if: matrix.stack == 'fastapi'
        working-directory: /tmp/suite-project/api
        run: pytest -q

      # Jest loads the ESM-only @nestjs and jwks-rsa packages only on Node 24.9+ and with the
      # --experimental-vm-modules flag the npm scripts pass; the generated Dockerfile runs 26.
      - name: Set up Node.js
        if: matrix.stack == 'nestjs'
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install NestJS dependencies
        if: matrix.stack == 'nestjs'
        working-directory: /tmp/suite-project/api
        run: npm ci --no-audit --no-fund

      # postinstall swallows a failed generate (`|| true`); running it here
      # makes that failure visible before the tests import the client.
      - name: Generate Prisma client
        if: matrix.stack == 'nestjs'
        working-directory: /tmp/suite-project/api
        run: npx prisma generate

      - name: Lint NestJS sources
        if: matrix.stack == 'nestjs'
        working-directory: /tmp/suite-project/api
        run: npm run lint

      - name: Check NestJS formatting
        if: matrix.stack == 'nestjs'
        working-directory: /tmp/suite-project/api
        run: npm run format:check

      # test:cov (not test) so the 75% coverageThreshold in package.json gates the build.
      - name: Run NestJS unit tests with the coverage gate
        if: matrix.stack == 'nestjs'
        working-directory: /tmp/suite-project/api
        run: npm run test:cov

      - name: Run NestJS e2e tests
        if: matrix.stack == 'nestjs'
        working-directory: /tmp/suite-project/api
        run: npm run test:e2e
