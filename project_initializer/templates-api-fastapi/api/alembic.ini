[alembic]
script_location = %(here)s/alembic

# The revision id carries the sequence number and the slug (create it with
# `alembic revision --rev-id 0003_add_widget`), so the file name is the id alone.
# Ids stay within 32 characters: that is the width of alembic_version.version_num.
file_template = %%(rev)s

# Anchored to this file so `alembic -c` works from any directory and `app` imports.
prepend_sys_path = %(here)s

# Without it a project path that contains a space, such as a mounted volume,
# would be split into several sys.path entries.
path_separator = os

# There is no sqlalchemy.url here on purpose: env.py takes the URL from the
# application settings (DIRECT_DATABASE_URL, falling back to DATABASE_URL), so
# the .env file is the only place that holds credentials. Logging is configured
# there too, from LOG_LEVEL and LOG_FORMAT.
