[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api"
version = "1.0.0"
description = "FastAPI service"
requires-python = ">=3.12"
dependencies = [
    # Core Framework
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "python-dotenv==1.2.4",

    # Database
    "SQLAlchemy==2.1.9",
    "psycopg2-binary==2.9.13",
    "alembic==1.20.1",

    # Data Validation
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    # Required by pydantic EmailStr (UserBase.email); pydantic does not bundle it.
    "email-validator==2.4.0",

    # Form-encoded request bodies: FastAPI refuses to declare a Form() parameter
    # without it. The token overlay's login endpoint is the one that uses it.
    "python-multipart==0.0.34",

    # Authentication (token overlay; unused by the no-auth variant)
    "python-jose[cryptography]==3.5.0",
    # Pinned to the 5.x contract security.py is written against: bcrypt raises
    # ValueError for a password over 72 bytes and for a malformed hash. security.py
    # checks both first, so verification never raises and never truncates, and a
    # hash written by bcrypt 4 still verifies (tests/unit/test_security.py).
    "bcrypt==5.0.0",
]

[project.optional-dependencies]
# Installed with `pip install ".[dev]"`; the Docker image leaves them out.
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    # Transport of Starlette's TestClient, which warns when only httpx is
    # installed; no base application module imports it.
    "httpx2==2.16.2",
]

# The project installs its metadata and dependencies only. The code runs from the
# source tree (`uvicorn app.main:app`), and with no package listed setuptools
# does not try to discover `app`, `alembic` and `tests` as one flat layout.
[tool.setuptools]
packages = []
