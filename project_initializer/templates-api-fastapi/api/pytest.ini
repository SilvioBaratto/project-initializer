[pytest]
testpaths = tests

python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Later entries win: third-party deprecations stay quiet, but a deprecated API
# called from ``app`` fails the run, so it is replaced before the next upgrade
# removes it.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    error::DeprecationWarning:app

# strict_markers turns a misspelled marker into an error instead of a test that
# silently never matches ``-m``. It is a pytest 9.0 option: an older pytest only
# warns about the unknown key and runs unstrict, which ``minversion`` rules out.
strict_markers = true
markers =
    unit: Unit tests (fast, no external service; in-memory SQLite and probe applications allowed)
    integration: Integration tests (in-memory SQLite, the real application)
    e2e: End-to-end smoke tests (application boot and OpenAPI surface)
    requirement(id): Requirement ID(s) a test traces to, see tests/__init__.py

# The gate measures line and branch coverage of ``app`` over the whole suite.
# Running a subset of the tests cannot reach it: add ``--no-cov`` there.
addopts =
    -v
    --tb=short
    --cov=app
    --cov-branch
    --cov-fail-under=75
    --cov-report=term-missing:skip-covered

minversion = 9.0

console_output_style = progress
