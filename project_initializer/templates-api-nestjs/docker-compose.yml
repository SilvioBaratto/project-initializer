services:
  # PostgreSQL Database
  db:
    image: postgres:19-alpine
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # From PostgreSQL 18 the image declares VOLUME /var/lib/postgresql and keeps the
      # cluster in /var/lib/postgresql/<major>/docker. A volume still mounted at
      # .../data makes the entrypoint exit 1, so the volume must hold the parent.
      - postgres_data:/var/lib/postgresql
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # NestJS Backend with hot reload
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: dev
    depends_on:
      db:
        condition: service_healthy
    # env_file feeds the container the whole root .env (NODE_ENV, PORT,
    # LOG_LEVEL, CORS_ORIGINS, ...). The environment: block is applied AFTER
    # env_file and overrides ONLY the values that must point at the compose-network
    # host (db) instead of the localhost values the app uses outside Docker.
    # Everything else must come from .env, not be hardcoded.
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/app_db?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@db:5432/app_db?schema=public"
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./api:/app
      - /app/node_modules
    networks:
      - app_network
    command: npm run start:dev
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/api/v1/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Angular Frontend with nginx and API proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-4200}:80"
    networks:
      - app_network

  # Database Admin UI
  adminer:
    image: adminer:6.3.0
    restart: always
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_HOST_PORT:-8080}:8080"
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
