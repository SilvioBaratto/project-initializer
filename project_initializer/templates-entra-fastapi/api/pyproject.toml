[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api"
version = "1.0.0"
description = "FastAPI service"
requires-python = ">=3.12"
dependencies = [
    # Core Framework
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "python-dotenv==1.2.4",

    # Database - Local PostgreSQL
    "SQLAlchemy==2.0.50",
    "psycopg2-binary==2.9.13",
    "alembic==1.20.1",

    # Data Validation
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    # Required by pydantic EmailStr (UserBase.email); pydantic does not bundle it.
    "email-validator==2.4.0",

    # Form-encoded request bodies: FastAPI refuses to declare a Form() parameter
    # without it. Only the token overlay's login endpoint uses it; this variant keeps it
    # so the base application code imports cleanly.
    "python-multipart==0.0.34",

    # HTTP Client
    "httpx==0.28.1",

    # Authentication - Microsoft Entra ID (in-process RS256 JWKS validation)
    # Stay on 2.13 or later: from there a failed key-set reload no longer wipes the
    # cached keys, which the unknown-kid cooldown relies on to keep known users in
    # during an Entra outage (tests/unit/test_entra_jwks_client_contract.py).
    "PyJWT[crypto]==2.15.1",
]

[project.optional-dependencies]
# Installed with `pip install ".[dev]"`; the Docker image leaves them out.
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    # Transport of Starlette's TestClient, which warns when only httpx is
    # installed.
    "httpx2==2.16.2",
]

# The project installs its metadata and dependencies only. The code runs from the
# source tree (`uvicorn app.main:app`), and with no package listed setuptools
# does not try to discover `app`, `alembic` and `tests` as one flat layout.
[tool.setuptools]
packages = []
