server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Content Security Policy. Inline <script> and <style> tags run only with this response's
    # nonce, $request_id (a fresh random value per request), which `location /` below writes
    # into index.html in place of its CSP_NONCE placeholder. style-src and font-src allow the
    # web fonts index.html loads from fonts.bunny.net.
    # Entra overlay: MSAL fetches the authority's metadata and tokens from login.microsoftonline.com
    # (connect-src) and can renew them in a hidden iframe (frame-src). For a CIAM or B2C authority,
    # put its host in both instead.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'nonce-$request_id' https://fonts.bunny.net; font-src 'self' https://fonts.bunny.net; img-src 'self' data:; connect-src 'self' https://login.microsoftonline.com; frame-src https://login.microsoftonline.com; object-src 'none'; base-uri 'self'" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Angular app - serve index.html for all routes (SPA)
    location / {
        try_files $uri $uri/ /index.html;

        # Swap every CSP_NONCE placeholder in index.html for this request's nonce. sub_filter drops
        # the Last-Modified and ETag validators, and `expires -1` forbids reuse without asking, so a
        # browser never pairs a stored page with a newer nonce.
        sub_filter CSP_NONCE $request_id;
        sub_filter_once off;
        expires -1;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
