<main class="login">
  <mat-card class="login-card" appearance="outlined">
    <mat-card-header class="login-header">
      <h1 matCardTitle>Sign in</h1>
      <p matCardSubtitle>Use your Microsoft account to continue</p>
    </mat-card-header>

    <mat-card-content class="login-content">
      @if (errorMessage()) {
        <p class="login-error" role="alert">{{ errorMessage() }}</p>
      }

      <!--
        While the redirect starts, the button is disabled but stays focusable (disabledInteractive
        renders aria-disabled instead of the native attribute, which would drop keyboard focus to
        <body>). onMicrosoftLogin ignores activation until the attempt settles.
      -->
      <button
        class="login-submit"
        matButton="filled"
        type="button"
        [disabled]="isLoading()"
        [disabledInteractive]="isLoading()"
        [attr.aria-busy]="isLoading() || null"
        (click)="onMicrosoftLogin()"
      >
        @if (isLoading()) {
          <!-- MatProgressSpinner sets tabindex="-1" on its host; a <button> may not contain one. -->
          <mat-progress-spinner
            matButtonIcon
            class="login-button-icon login-spinner"
            mode="indeterminate"
            [diameter]="18"
            [attr.tabindex]="null"
            aria-hidden="true"
          />
        } @else {
          <!--
            Microsoft logo: a brand mark whose colors are fixed by Microsoft, so it stays untinted.
            login.css puts it on a neutral tile, because the colors vanish on the primary container.
          -->
          <svg
            matButtonIcon
            class="login-button-icon login-logo"
            viewBox="0 0 21 21"
            width="18"
            height="18"
            aria-hidden="true"
            focusable="false"
          >
            <rect x="1" y="1" width="9" height="9" fill="#f25022" />
            <rect x="11" y="1" width="9" height="9" fill="#7fba00" />
            <rect x="1" y="11" width="9" height="9" fill="#00a4ef" />
            <rect x="11" y="11" width="9" height="9" fill="#ffb900" />
          </svg>
        }
        Sign in with Microsoft
      </button>

      <!-- Outside the aria-busy button so the in-progress status is announced. -->
      <p class="cdk-visually-hidden" role="status">
        @if (isLoading()) {
          Signing in with Microsoft…
        }
      </p>
    </mat-card-content>
  </mat-card>
</main>
