[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api"
version = "1.0.0"
description = "FastAPI service"
requires-python = ">=3.12"
dependencies = [
    # Core Framework
    "fastapi==0.136.3",
    "uvicorn==0.49.0",
    "python-dotenv==1.2.2",

    # Database (PostgreSQL hosted by Supabase)
    "SQLAlchemy==2.0.50",
    "psycopg2-binary==2.9.12",
    "alembic==1.18.4",

    # Data Validation
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    # Required by pydantic EmailStr (UserBase.email); pydantic does not bundle it.
    "email-validator==2.3.0",

    # Form-encoded request bodies: FastAPI refuses to declare a Form() parameter
    # without it. Only the token overlay's login endpoint uses it; this variant keeps it
    # so the base application code imports cleanly.
    "python-multipart==0.0.32",

    # HTTP Client
    "httpx==0.28.1",

    # Authentication - Supabase
    "supabase==2.31.0",
]

[project.optional-dependencies]
# Installed with `pip install ".[dev]"`; the Docker image leaves them out.
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
]

# The project installs its metadata and dependencies only. The code runs from the
# source tree (`uvicorn app.main:app`), and with no package listed setuptools
# does not try to discover `app`, `alembic` and `tests` as one flat layout.
[tool.setuptools]
packages = []
