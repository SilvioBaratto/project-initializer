<main class="login">
  <mat-card class="login-card" appearance="outlined">
    <mat-card-header class="login-header">
      <h1 matCardTitle>Sign in</h1>
      <p matCardSubtitle>Enter your token to continue</p>
    </mat-card-header>

    <mat-card-content class="login-content">
      @if (errorMessage()) {
        <!-- When the token was rejected, also the token field's description, so its invalid state carries the reason. -->
        <p id="login-error" class="login-error" role="alert">{{ errorMessage() }}</p>
      }

      <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field class="login-field" appearance="outline">
          <mat-label>Token</mat-label>
          <input
            #tokenInput
            matInput
            id="token"
            type="password"
            formControlName="token"
            autocomplete="current-password"
            [errorStateMatcher]="tokenErrorMatcher"
            [aria-describedby]="tokenRejected() ? 'login-error' : ''"
          />
          @if (form.controls.token.hasError('required')) {
            <mat-error>Enter your token</mat-error>
          }
        </mat-form-field>

        <!--
          While signing in, the button is disabled but stays focusable (disabledInteractive renders
          aria-disabled instead of the native attribute, which would drop keyboard focus to <body>).
          It still submits the form, so onSubmit ignores activation until the request settles.
        -->
        <button
          class="login-submit"
          matButton="filled"
          type="submit"
          [disabled]="isLoading()"
          [disabledInteractive]="isLoading()"
          [attr.aria-busy]="isLoading() || null"
        >
          @if (isLoading()) {
            <!-- MatProgressSpinner sets tabindex="-1" on its host; a <button> may not contain one. -->
            <mat-progress-spinner
              matButtonIcon
              class="login-spinner"
              mode="indeterminate"
              [diameter]="18"
              [attr.tabindex]="null"
              aria-hidden="true"
            />
          }
          Sign in
        </button>
      </form>

      <!-- Outside the aria-busy button so the in-progress status is announced. -->
      <p class="cdk-visually-hidden" role="status">
        @if (isLoading()) {
          Signing in…
        }
      </p>
    </mat-card-content>
  </mat-card>

  <p class="login-footnote">Secure authentication</p>
</main>
