<div class="page">
  <mat-card appearance="outlined" class="hero">
    <app-badge variant="primary">New</app-badge>
    <h1 class="hero-title">Welcome back</h1>
    <p class="hero-text">Your starter shell is ready. Replace this page with your product's home.</p>
  </mat-card>

  <!-- role="list": list-style none makes WebKit drop the implicit list semantics. -->
  <ul class="stats" role="list">
    @for (stat of stats; track stat.label) {
      <li class="stat-item">
        <!-- Numbers go through locale pipes; the tile names the direction in text next to its chevron. -->
        <app-stat-card
          [label]="stat.label"
          [metric]="(stat.value | number) ?? ''"
          [delta]="stat.delta | percent"
          [deltaDirection]="stat.direction"
        />
      </li>
    }
  </ul>
</div>
