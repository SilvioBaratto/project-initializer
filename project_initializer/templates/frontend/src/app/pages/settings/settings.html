<div class="settings">
  <div class="settings-header">
    <h1 class="settings-title">Settings</h1>
    <p class="settings-intro">Manage your workspace preferences</p>
  </div>

  <section aria-labelledby="settings-appearance-title">
    <mat-card appearance="outlined" class="settings-card">
      <mat-card-header>
        <h2 mat-card-title id="settings-appearance-title">Appearance</h2>
        <p mat-card-subtitle class="settings-card-subtitle">Choose how the interface looks</p>
      </mat-card-header>

      <mat-card-content class="settings-card-content">
        <!-- Single-selection segmented button: role="radiogroup", arrow keys move the selection,
             and the selected segment shows a check mark in place of its icon. -->
        <mat-button-toggle-group
            class="theme-options"
            name="theme"
            aria-label="Theme"
            [value]="theme()"
            (change)="select($event.value)">
          @for (option of options; track option.mode) {
            <mat-button-toggle
                [value]="option.mode"
                [attr.data-theme-option]="option.mode">
              @if (theme() !== option.mode) {
                <lucide-icon class="theme-option-icon" [name]="option.icon" [size]="18" />
              }
              <span>{{ option.label }}</span>
            </mat-button-toggle>
          }
        </mat-button-toggle-group>
      </mat-card-content>
    </mat-card>
  </section>
</div>
