<svg [lucideIcon]="icon()" class="alert-icon" />

<div class="alert-message" [attr.role]="role()">
  <span class="cdk-visually-hidden">{{ statusLabel() }}:&ngsp;</span>
  <ng-content />
</div>

@if (dismissible()) {
  <button
    matIconButton
    type="button"
    class="alert-dismiss"
    [attr.aria-label]="dismissLabel()"
    (click)="dismiss()"
  >
    <svg lucideIcon="X" />
  </button>
}
