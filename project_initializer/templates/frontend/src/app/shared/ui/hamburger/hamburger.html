<button
  matIconButton
  type="button"
  class="hamburger"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="controls() || null"
  [attr.aria-label]="label()"
  (click)="toggle.emit()"
>
  <svg
    [lucideIcon]="icon()"
    class="hamburger-icon"
    [class]="directional() ? 'hamburger-icon-directional' : ''"
    aria-hidden="true"
  />
</button>
