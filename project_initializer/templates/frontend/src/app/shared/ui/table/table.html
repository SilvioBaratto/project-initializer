<!--
  Scroll region: overflow-x and overscroll-behavior live in table.css. Only while its content
  overflows is it a tab stop, so keyboard users can scroll it, and a region landmark when the
  consumer names it. A table that fits adds neither, and a page never gets an unnamed landmark.
-->
<div
  class="table-region"
  #region
  [attr.tabindex]="scrollable() ? 0 : null"
  [attr.role]="scrollable() && accessibleName() ? 'region' : null"
  [attr.aria-label]="scrollable() ? accessibleName() : null"
  (blur)="onRegionBlur()"
>
  <!-- Medium and wider (min-width: 600px): Material data table with native table semantics -->
  <table mat-table class="table-data" [dataSource]="rows()" [attr.aria-label]="accessibleName()">
    @for (column of columns(); track column.key) {
      <ng-container [matColumnDef]="column.key">
        <th mat-header-cell *matHeaderCellDef scope="col">{{ column.header }}</th>
        <td mat-cell *matCellDef="let row">{{ row[column.key] }}</td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="columnKeys()"></tr>
    <tr mat-row *matRowDef="let row; columns: columnKeys()"></tr>
  </table>

  <!-- Compact (below 600px): one stacked card per row, each field a header / value pair -->
  <ul class="table-cards" role="list" [attr.aria-label]="accessibleName()">
    @for (row of rows(); track $index) {
      <li class="table-card">
        <dl class="table-card-fields">
          @for (column of columns(); track column.key) {
            <div class="table-card-field">
              <dt class="table-card-label">{{ column.header }}</dt>
              <dd class="table-card-value">{{ row[column.key] }}</dd>
            </div>
          }
        </dl>
      </li>
    }
  </ul>
</div>
