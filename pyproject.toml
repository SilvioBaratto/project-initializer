[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-initializer"
version = "0.7.0"
description = "CLI tool to scaffold full-stack projects with FastAPI or NestJS, Angular, and Docker"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Silvio Baratto"}
]
keywords = ["cli", "scaffold", "fastapi", "nestjs", "angular", "docker", "project-generator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.29.2",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17.6,<0.18",
    "pytest>=9.2.0",
    "hypothesis>=6.170.17",
    "pyyaml>=6.0.4",
]

[project.scripts]
project-initializer = "project_initializer.cli:main"

[project.urls]
Homepage = "https://github.com/silviobaratto/project-initializer"
Repository = "https://github.com/silviobaratto/project-initializer"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit test",
    "integration: integration test",
    "e2e: end-to-end test",
]

[tool.ruff.lint]
# Ruff 0.16 raised its default rule set from 59 to 413 rules. Pinning these four
# families keeps the rules the repo has always enforced, so `ruff check . tests`
# (also run by the managed CI workflow) means the same thing on every ruff version.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["project_initializer*"]

[tool.setuptools.package-data]
"project_initializer" = [
    "env_defaults.env", "py.typed",
    "templates/**/*", "templates/**/.*",
    "templates-api-fastapi/**/*", "templates-api-fastapi/**/.*",
    "templates-api-nestjs/**/*", "templates-api-nestjs/**/.*",
    "templates-token-fastapi/**/*", "templates-token-fastapi/**/.*",
    "templates-token-nestjs/**/*", "templates-token-nestjs/**/.*",
    "templates-token-frontend/**/*", "templates-token-frontend/**/.*",
    "templates-supabase-fastapi/**/*", "templates-supabase-fastapi/**/.*",
    "templates-supabase-nestjs/**/*", "templates-supabase-nestjs/**/.*",
    "templates-supabase-frontend/**/*", "templates-supabase-frontend/**/.*",
    "templates-asyncdb-fastapi/**/*", "templates-asyncdb-fastapi/**/.*",
    "templates-entra-fastapi/**/*", "templates-entra-fastapi/**/.*",
    "templates-entra-nestjs/**/*", "templates-entra-nestjs/**/.*",
    "templates-entra-frontend/**/*", "templates-entra-frontend/**/.*",
]

[tool.setuptools.exclude-package-data]
"project_initializer" = [
    "*/node_modules/*",
    "*/node_modules/**/*",
    "**/node_modules/*",
    "**/node_modules/**/*",
]
